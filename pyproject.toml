[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yello-core"
description = "Artisan-style CLI and base classes for a Laravel-style Django domain layout."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yello" }]
keywords = ["django", "djangorestframework", "laravel", "cli", "scaffold", "codegen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "typer>=0.12",
    "rich>=13",
]
dynamic = ["version"]

[project.scripts]
yello = "yello.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "django-stubs",
]

[tool.hatch.version]
path = "src/yello/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yello"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
